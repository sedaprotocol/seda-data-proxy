name: 🚀 Release
on:
  push:
    tags: ["*"]

permissions: {}

env:
  REGISTRY_IMAGE: ghcr.io/sedaprotocol/seda-data-proxy
  # Tags in Artifact Registry are immutable, so only the exact version is pushed there (no latest/major/minor).
  GAR_HOST: europe-docker.pkg.dev
  GAR_IMAGE: europe-docker.pkg.dev/${{ vars.GAR_PROJECT_ID }}/data-proxy/seda-data-proxy

jobs:
  changelog:
    name: 🛠️ Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 📦 Install Dependencies
        run: bun install --frozen-lockfile

      - name: 📝 Generate Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: false
          skip-commit: true
          skip-tag: true
          skip-git-pull: true
          git-push: false

  build_and_push_docker_images:
    name: 🐳 Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Verify package.json version matches tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version workspace/data-proxy/package.json)
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME != package.json version $PKG"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GAR_WIF_PROVIDER }}
          service_account: ${{ vars.GAR_PUBLISHER_SA }}
          token_format: access_token
          create_credentials_file: false

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}

      - name: 🏷️ Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            latest

      - name: 🐳 Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .build/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.GAR_IMAGE }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TARGET_ARCH=bun-linux-x64

      - name: 🔏 Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: 🔏 Sign image
        run: cosign sign --yes ${{ env.REGISTRY_IMAGE }}@${{ steps.build.outputs.digest }}

      # Separate from the login step so the credentials file only exists after the image is built.
      - name: Authenticate to Google Cloud for signing
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GAR_WIF_PROVIDER }}
          service_account: ${{ vars.GAR_PUBLISHER_SA }}

      # cosign v3 in its own directory, matching seda-candles; the keyless GHCR signature above stays on v2.
      - name: Install cosign for Artifact Registry
        uses: sigstore/cosign-installer@v4.1.2
        with:
          install-dir: ${{ runner.temp }}/cosign-v3

      # Empty signing config: no transparency log, so verification matches the other internal images.
      - name: Sign image in Artifact Registry
        env:
          COSIGN_KEY: ${{ vars.COSIGN_KEY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign signing-config create --out "$RUNNER_TEMP/signing-config.json"
          cosign sign --yes \
            --key "$COSIGN_KEY" \
            --signing-config "$RUNNER_TEMP/signing-config.json" \
            "${GAR_IMAGE}@${DIGEST}"

  create_release:
    name: 🎉 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [changelog, build_and_push_docker_images]
    permissions:
      contents: write
    steps:
      - name: 🎉 Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          draft: ${{ contains(github.ref_name, 'dev') }}
          prerelease: ${{ contains(github.ref_name, 'rc') }}
          allowUpdates: true
          generateReleaseNotes: true
          body: ${{ needs.build.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          commit: ${{ github.sha }}
          tag: ${{ github.ref_name }}
